<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZhBlog Admin</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        background: #f7f3eb;
        color: #1f2937;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      .card {
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.85);
        padding: 28px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Admin entry updated</h1>
        <p>This legacy Decap CMS entry has been removed.</p>
        <p>Please use the built-in editor at <a href="/admin">/admin</a>.</p>
      </section>
    </main>
  </body>
</html>
