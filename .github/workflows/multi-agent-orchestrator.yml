name: Multi-Agent Orchestrator

on:
  workflow_dispatch:
    inputs:
      goal:
        description: Primary development goal for this run
        required: true
        type: string
      agent_profile:
        description: Agent set to run
        required: true
        default: blog-feature
        type: choice
        options:
          - blog-feature
          - content-refresh
          - maintenance
      target_branch:
        description: Branch to check out
        required: false
        default: main
        type: string
      dry_run:
        description: Skip external agent command and only generate local reports
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 1 * * *"

concurrency:
  group: multi-agent-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Prepare Agent Matrix
    runs-on: ubuntu-latest
    outputs:
      agent_matrix: ${{ steps.matrix.outputs.agent_matrix }}
      run_goal: ${{ steps.context.outputs.run_goal }}
      run_branch: ${{ steps.context.outputs.run_branch }}
      run_profile: ${{ steps.context.outputs.run_profile }}
      dry_run: ${{ steps.context.outputs.dry_run }}
    steps:
      - name: Build matrix
        id: matrix
        shell: bash
        run: |
          profile="${{ inputs.agent_profile || 'maintenance' }}"
          case "$profile" in
            blog-feature)
              matrix='["planner","nextjs","content","qa"]'
              ;;
            content-refresh)
              matrix='["planner","content","obsidian","qa"]'
              ;;
            maintenance)
              matrix='["planner","refactor","deps","qa"]'
              ;;
            *)
              echo "Unsupported profile: $profile" >&2
              exit 1
              ;;
          esac

          echo "agent_matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Resolve context
        id: context
        shell: bash
        run: |
          goal_input="${{ inputs.goal }}"
          profile="${{ inputs.agent_profile || 'maintenance' }}"
          branch="${{ inputs.target_branch || github.ref_name }}"
          dry_run_input="${{ inputs.dry_run }}"

          if [ -z "$goal_input" ]; then
            goal_input="Scheduled maintenance sweep for ${{ github.repository }}"
          fi

          if [ -z "$dry_run_input" ]; then
            dry_run_input="false"
          fi

          {
            echo "run_goal=$goal_input"
            echo "run_branch=$branch"
            echo "run_profile=$profile"
            echo "dry_run=$dry_run_input"
          } >> "$GITHUB_OUTPUT"

  agent:
    name: Agent / ${{ matrix.role }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJson(needs.prepare.outputs.agent_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.run_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run agent
        env:
          AGENT_ROLE: ${{ matrix.role }}
          AGENT_GOAL: ${{ needs.prepare.outputs.run_goal }}
          AGENT_PROFILE: ${{ needs.prepare.outputs.run_profile }}
          AGENT_COMMAND: ${{ vars.MULTI_AGENT_COMMAND }}
          AGENT_DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/multi-agent/agent-runner.mjs

      - name: Upload agent report
        uses: actions/upload-artifact@v4
        with:
          name: agent-report-${{ matrix.role }}
          path: .artifacts/agents/${{ matrix.role }}.json
          retention-days: 7

  summarize:
    name: Summarize Agent Reports
    needs:
      - prepare
      - agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download agent reports
        uses: actions/download-artifact@v4
        with:
          pattern: agent-report-*
          path: .artifacts/downloaded
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build summary
        env:
          AGENT_GOAL: ${{ needs.prepare.outputs.run_goal }}
          AGENT_PROFILE: ${{ needs.prepare.outputs.run_profile }}
        run: node scripts/multi-agent/summarize-reports.mjs

      - name: Upload consolidated summary
        uses: actions/upload-artifact@v4
        with:
          name: multi-agent-summary
          path: .artifacts/summary
          retention-days: 7

      - name: Publish job summary
        shell: bash
        run: cat .artifacts/summary/summary.md >> "$GITHUB_STEP_SUMMARY"
